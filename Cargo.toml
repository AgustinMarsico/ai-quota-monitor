[package]
name = "ai-quota-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Coordinated local AI quota monitor"

[[bin]]
name = "ai-quota"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
httpdate = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
